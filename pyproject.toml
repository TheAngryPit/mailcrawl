[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailcrawl"
version = "0.0.0"
description = "Local archive for one inbox."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vectors = [
  "sqlite-vec",
  "sentence-transformers>=6.1",
]

[tool.setuptools.packages.find]
include = ["mailcrawl*"]
