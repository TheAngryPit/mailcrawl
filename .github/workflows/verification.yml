name: verification-report

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  report:
    if: github.event.workflow_run.path == '.github/workflows/check.yml'
    runs-on: ubuntu-latest
    steps:
      - name: Report actual hosted results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          state=failure
          tested="$(gh api "repos/$GH_REPO/contents/.github/workflows/check.yml?ref=$HEAD_SHA" --jq .sha)"
          approved="$(gh api "repos/$GH_REPO/contents/.github/workflows/check.yml?ref=main" --jq .sha)"
          jobs="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --jq '.jobs[] | {name, conclusion}' | jq -s .)"
          if [[ "$tested" == "$approved" && "$CONCLUSION" == success ]] && jq -e '
            [.[] | select(.name == "check" or .name == "e2e")] |
            (map(.name) | sort) == ["check", "e2e"] and
            all(.conclusion == "success")' <<<"$jobs" >/dev/null; then
            state=success
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f context=verification -f state="$state" \
            -f description="Hosted CI: check and e2e / $state" \
            -f target_url="$RUN_URL"
