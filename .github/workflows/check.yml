name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pdftotext
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Pillow
        shell: bash
        run: python3 -m pip install --user pillow || python3 -m pip install --user --break-system-packages pillow

      - name: Make check without sqlite-vec
        shell: bash
        run: make check

      - name: Install sqlite-vec
        shell: bash
        run: python3 -m pip install --user sqlite-vec || python3 -m pip install --user --break-system-packages sqlite-vec

      - name: Make check with sqlite-vec
        shell: bash
        run: make check

      - name: Scaffold proof
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/mailcrawl-proof
        run: scripts/proof.sh
